name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: make lint (gofmt, go vet, web type-check)
        # npm ci runs first (web-deps), hence setup-node.
        run: make lint

  test:
    name: Test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test (shard)
        env:
          CGO_ENABLED: "1" # -race requires cgo
        run: |
          pkgs=$(go list ./... | awk -v s=${{ matrix.shard }} 'NR%4==s')
          if [ -z "$pkgs" ]; then
            echo "no packages in shard ${{ matrix.shard }}"
            exit 0
          fi
          go test -race $pkgs

  build:
    name: Build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: cross-compile
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/wattson
      - name: route import budget (100 km < 200 ms, non-race)
        # TestImportBudget skips under -race, so the test shards never run it.
        if: matrix.goarch == 'amd64'
        run: go test -count=1 -run Budget ./internal/route/

  web:
    name: Web (lint, test, build, size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: lint
        working-directory: web
        run: npm run lint
      - name: vitest
        working-directory: web
        run: npm test
      - name: build
        working-directory: web
        run: npm run build
      - name: bundle size (400 KB gzipped)
        working-directory: web
        run: npm run size

  drift:
    name: OpenAPI / AsyncAPI / TS types drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: regenerate
        run: make openapi
      - name: generated files are committed
        run: git diff --exit-code -- docs/openapi.json docs/asyncapi.yaml web/src/lib/openapi.d.ts

  e2e:
    name: E2E (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build the binary with the embedded UI
        run: make build
      - name: install chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: playwright
        working-directory: web
        # Every worker runs its own server (own port and data dir).
        run: npm run e2e -- --shard=${{ matrix.shard }}/3
      - name: upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: web/playwright-report
          retention-days: 7

  perf:
    name: Lighthouse (mobile budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build the binary with the embedded UI (also checks the chunk budgets)
        run: make build
      - name: install chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: lighthouse (performance, accessibility, best practices; median of 5, an over-budget page re-run once)
        working-directory: web
        run: npm run perf
      - name: upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: web/lighthouse-report
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: build (linux/amd64, loaded)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: wattson:ci
          cache-from: type=gha,scope=wattson-ci
          cache-to: type=gha,mode=max,scope=wattson-ci,ignore-error=true
      - name: smoke (size < 30 MB, non-root, ride, RSS < 30 MiB)
        run: scripts/docker-smoke.sh wattson:ci
      - name: build (linux/arm64, not loaded)
        # The Go and Node stages run on the build platform and cross-compile,
        # so no emulation is needed.
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=wattson-ci

  ci:
    # Single required check for branch protection; aggregates every job.
    name: CI
    needs: [lint, test, build, web, drift, e2e, perf, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs must succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null
