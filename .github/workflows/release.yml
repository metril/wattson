name: Release

# Runs only after CI passes on a push to main (or manually).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Rebuild the image for this existing release tag (e.g. v0.1.0); empty runs release-please
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: write

jobs:
  release-please:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.out.outputs.release_created }}
      tag_name: ${{ steps.out.outputs.tag_name }}
      version: ${{ steps.out.outputs.version }}
    steps:
      - id: rp
        if: ${{ !inputs.tag }}
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # PRs opened with GITHUB_TOKEN do not trigger workflows, so run the required CI check explicitly.
      # The pr output is empty when a release is cut, so parse it in the shell.
      - name: run CI on the release PR
        if: ${{ !inputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.rp.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName // empty' <<<"${PR:-null}")
          if [ -n "$branch" ]; then gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"; fi
      - id: out
        env:
          IN_TAG: ${{ inputs.tag }}
          CREATED: ${{ steps.rp.outputs.release_created }}
          TAG: ${{ steps.rp.outputs.tag_name }}
          VER: ${{ steps.rp.outputs.version }}
        run: |
          if [ -n "$IN_TAG" ]; then CREATED=true TAG="$IN_TAG" VER="${IN_TAG#v}"; fi
          { echo "release_created=${CREATED:-false}"; echo "tag_name=$TAG"; echo "version=$VER"; } >> "$GITHUB_OUTPUT"

  image:
    needs: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || github.event.workflow_run.head_sha || github.sha }}
      - id: ver
        env:
          RELEASED: ${{ needs.release-please.outputs.release_created }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          VER: ${{ needs.release-please.outputs.version }}
        run: |
          if [ "$RELEASED" = true ]; then v="$VER"; else v="edge-${SHA::7}"; fi
          { echo "version=$v"; echo "sha=$SHA"; echo "short=${SHA::7}"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # workflow_run's github.sha is main's tip, not the commit CI tested.
          labels: |
            org.opencontainers.image.revision=${{ steps.ver.outputs.sha }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.release_created == 'true' && !startsWith(needs.release-please.outputs.tag_name, 'v0.') }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.release_created == 'true' && !startsWith(needs.release-please.outputs.tag_name, 'v0.') }}
            type=raw,value=latest,enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=raw,value=edge,enable=${{ needs.release-please.outputs.release_created != 'true' }}
            type=raw,value=sha-${{ steps.ver.outputs.short }},enable=${{ needs.release-please.outputs.release_created != 'true' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: |
            type=gha,scope=wattson-release
            type=gha,scope=wattson-ci
          cache-to: type=gha,mode=max,scope=wattson-release,ignore-error=true
      - id: meta-brouter
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-brouter
          labels: |
            org.opencontainers.image.revision=${{ steps.ver.outputs.sha }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.release_created == 'true' && !startsWith(needs.release-please.outputs.tag_name, 'v0.') }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.release_created == 'true' && !startsWith(needs.release-please.outputs.tag_name, 'v0.') }}
            type=raw,value=latest,enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=raw,value=edge,enable=${{ needs.release-please.outputs.release_created != 'true' }}
            type=raw,value=sha-${{ steps.ver.outputs.short }},enable=${{ needs.release-please.outputs.release_created != 'true' }}
      - uses: docker/build-push-action@v7
        with:
          context: brouter
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-brouter.outputs.tags }}
          labels: ${{ steps.meta-brouter.outputs.labels }}
          cache-from: |
            type=gha,scope=brouter-release
            type=gha,scope=brouter-ci
          cache-to: type=gha,mode=max,scope=brouter-release,ignore-error=true
