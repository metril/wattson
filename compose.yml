services:
  wattson:
    build: .
    image: wattson:local
    ports: ["8080:8080"]
    volumes:
      - wattson-data:/data
      # BRouter map regions (rd5 segments) that wattson downloads and brouter reads.
      - brouter-segments:/segments
      # BlueZ over D-Bus, for a bike on this host's adapter. Not needed for the
      # simulator or the ESPHome proxy; remove the line if the host has no bluetoothd.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
    # host bluetooth gid: getent group bluetooth | cut -d: -f3 (not needed for the simulator or the ESPHome proxy)
    group_add: ["112"]
    restart: unless-stopped
    # A stop returns the bike to its minimum level first (up to 10 s), then drains HTTP (up to 10 s).
    stop_grace_period: 25s

  # Route drawing. Wattson downloads map regions into the shared volume
  # (Settings -> Map regions); brouter only reads them.
  #
  # Image pinned by tag AND digest, resolved 2026-11-02 (docker buildx imagetools inspect):
  # v1.7.8 (2025-07-12) is the newest release the project has published as an image; later
  # releases (v1.7.9, v1.7.10) have no image on ghcr.io. nrenner/brouter does not exist on
  # Docker Hub; the official image is ghcr.io/abrensch/brouter. Bump by re-inspecting the tag.
  # Verified in the image: BRouter listens on 17777 (fixed in /bin/server.sh), reads segments
  # from /segments4, and runs with a fixed heap (-Xmx128M, JAVA_OPTS is not read; plenty for
  # drawing). It is amd64 only at this tag; on arm64 use the multi-arch :master image
  # (not pinned) or run BRouter elsewhere and set its URL in Settings.
  # The port is not published: wattson reaches it as http://brouter:17777 (the default
  # BRouter URL in Settings).
  brouter:
    image: ghcr.io/abrensch/brouter:v1.7.8@sha256:3c6c8a616f054f9237c900760add5fec6b88fc17108348fb2733a1dd62444165
    volumes:
      - brouter-segments:/segments4:ro
    # Start after wattson so the volume is first created from wattson's /segments,
    # which is owned by uid 65532 and therefore writable by wattson.
    depends_on: [wattson]
    restart: unless-stopped

volumes:
  wattson-data:
  brouter-segments:
