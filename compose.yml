services:
  wattson:
    build: .
    image: wattson:local
    ports: ["8070:8080"]
    volumes:
      - wattson-data:/data
      # BRouter map regions (rd5 segments) that wattson downloads and brouter reads.
      - brouter-segments:/segments
      # BlueZ over D-Bus, for a bike on this host's adapter. Not needed for the
      # simulator or the ESPHome proxy; remove the line if the host has no bluetoothd.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
    # host bluetooth gid: getent group bluetooth | cut -d: -f3 (not needed for the simulator or the ESPHome proxy)
    group_add: ["112"]
    restart: unless-stopped
    # A stop returns the bike to its minimum level first (up to 10 s), then drains HTTP (up to 10 s).
    stop_grace_period: 25s

  # Route drawing. Wattson downloads map regions into the shared volume
  # (Settings -> Map regions); brouter only reads them.
  #
  # Built from upstream source, pinned to the v1.7.10 commit. The project publishes no image
  # past v1.7.8, whose lookups.dat is v10, but segments from brouter.de are lookup v11 (BRouter
  # v1.7.9+), so v1.7.8 fails with "lookup version mismatch (old rd5?)". The upstream
  # Dockerfile builds multi-arch (amd64 and arm64); listens on 17777, reads segments from
  # /segments4 and profiles from /profiles2. First build takes a few minutes (gradle).
  # The port is not published: wattson reaches it as http://brouter:17777 (the default
  # BRouter URL in Settings).
  brouter:
    build:
      context: https://github.com/abrensch/brouter.git#4d2639af77ea5ed9c30d3e400764eb6f9e8522da
    image: brouter:1.7.10-local
    volumes:
      - brouter-segments:/segments4:ro
    # Start after wattson so the volume is first created from wattson's /segments,
    # which is owned by uid 65532 and therefore writable by wattson.
    depends_on: [wattson]
    restart: unless-stopped
    # Hardening: no capabilities, no privilege gain, read-only root (the JVM
    # needs a writable /tmp).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]

volumes:
  wattson-data:
  brouter-segments:
