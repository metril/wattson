services:
  wattson:
    # Production: always pulls the newest release from GHCR on `docker compose up`.
    # Pin a version with :X.Y.Z, or track main with :edge.
    # To build locally instead, uncomment `build: .` and drop pull_policy.
    # build: .
    image: ghcr.io/metril/wattson:latest
    pull_policy: always
    ports: ["8070:8080"]
    volumes:
      - wattson-data:/data
      # BRouter map regions (rd5 segments) that wattson downloads and brouter reads.
      - brouter-segments:/segments
    # Host Bluetooth (BlueZ over D-Bus) is opt-in: see compose.bluetooth.yml.
    # The simulator and the ESPHome proxy need nothing extra.
    restart: unless-stopped
    # A stop returns the bike to its minimum level first (up to 10 s), then drains HTTP (up to 10 s).
    stop_grace_period: 25s

  # Route drawing. Wattson downloads map regions into the shared volume
  # (Settings -> Map regions); brouter only reads them.
  #
  # Built in this repo from the pinned upstream v1.7.10 commit (brouter/Dockerfile) and
  # published as a multi-arch image: upstream ships none past v1.7.8, which cannot read
  # current brouter.de segments (lookup v11).
  # The port is not published: wattson reaches it as http://brouter:17777 (the default
  # BRouter URL in Settings).
  brouter:
    image: ghcr.io/metril/wattson-brouter:latest
    pull_policy: always
    # build: ./brouter
    volumes:
      - brouter-segments:/segments4:ro
    # Start after wattson so the volume is first created from wattson's /segments,
    # which is owned by uid 65532 and therefore writable by wattson.
    depends_on: [wattson]
    restart: unless-stopped
    # Hardening: no capabilities, no privilege gain, read-only root (the JVM
    # needs a writable /tmp).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]

volumes:
  wattson-data:
  brouter-segments:
