{
  "asyncapi": "3.0.0",
  "channels": {
    "ride": {
      "address": "/ws",
      "bindings": {
        "ws": {
          "bindingVersion": "0.1.0",
          "method": "GET"
        }
      },
      "description": "The one channel: ride events flow to the client, commands flow to the server.",
      "messages": {
        "ack": {
          "$ref": "#/components/messages/ack"
        },
        "bike": {
          "$ref": "#/components/messages/bike"
        },
        "command": {
          "$ref": "#/components/messages/command"
        },
        "error": {
          "$ref": "#/components/messages/error"
        },
        "state": {
          "$ref": "#/components/messages/state"
        },
        "tick": {
          "$ref": "#/components/messages/tick"
        }
      },
      "servers": [
        {
          "$ref": "#/servers/local"
        }
      ],
      "title": "Ride"
    },
    "wattson/command/{command}": {
      "address": "wattson/command/{command}",
      "description": "Buttons: start a free ride, pause, resume, stop, change the resistance level by one (in a route ride this shifts the live bias), or release the bike.",
      "messages": {
        "mqttPress": {
          "$ref": "#/components/messages/mqttPress"
        }
      },
      "parameters": {
        "command": {
          "description": "Which button was pressed.",
          "enum": [
            "start",
            "pause",
            "resume",
            "stop",
            "level_up",
            "level_down",
            "release_bike"
          ]
        }
      },
      "servers": [
        {
          "$ref": "#/servers/mqtt"
        }
      ],
      "title": "Button command"
    },
    "wattson/state": {
      "address": "wattson/state",
      "description": "Retained JSON ride state.",
      "messages": {
        "mqttState": {
          "$ref": "#/components/messages/mqttState"
        }
      },
      "servers": [
        {
          "$ref": "#/servers/mqtt"
        }
      ],
      "title": "Ride state"
    },
    "wattson/status": {
      "address": "wattson/status",
      "description": "Retained availability of the bridge, with a retained last will of `offline`.",
      "messages": {
        "mqttStatus": {
          "$ref": "#/components/messages/mqttStatus"
        }
      },
      "servers": [
        {
          "$ref": "#/servers/mqtt"
        }
      ],
      "title": "Availability"
    }
  },
  "components": {
    "messages": {
      "ack": {
        "contentType": "application/json",
        "description": "The command with this id was accepted by the ride engine.",
        "name": "ack",
        "payload": {
          "$ref": "#/components/schemas/WSAck"
        },
        "summary": "Command accepted",
        "title": "Ack"
      },
      "bike": {
        "contentType": "application/json",
        "description": "The bike connection changed state, rider, protocol or error.",
        "name": "bike",
        "payload": {
          "$ref": "#/components/schemas/WSBike"
        },
        "summary": "Bike status changed",
        "title": "Bike"
      },
      "command": {
        "contentType": "application/json",
        "description": "Starts, pauses, resumes or stops the ride, or changes the resistance level. Needs the control scope.",
        "name": "command",
        "payload": {
          "$ref": "#/components/schemas/WSCommand"
        },
        "summary": "Ride command",
        "title": "Command"
      },
      "error": {
        "contentType": "application/json",
        "description": "A command failed or a message could not be understood. The connection stays open.",
        "name": "error",
        "payload": {
          "$ref": "#/components/schemas/WSError"
        },
        "summary": "Command or message rejected",
        "title": "Error"
      },
      "mqttPress": {
        "contentType": "text/plain",
        "description": "Sent by a Home Assistant button. The payload is ignored. A retained command is never executed, and commands carry no user: the broker is trusted.",
        "name": "mqttPress",
        "payload": {
          "description": "The fixed button payload, PRESS.",
          "enum": [
            "PRESS"
          ],
          "type": "string"
        },
        "summary": "Press a Wattson button",
        "title": "Button press"
      },
      "mqttState": {
        "contentType": "application/json",
        "description": "Retained. Published when the ride state changes, at most once per second; every Home Assistant sensor reads one field of it.",
        "name": "mqttState",
        "payload": {
          "$ref": "#/components/schemas/MQTTState"
        },
        "summary": "Ride state for Home Assistant sensors",
        "title": "Ride state"
      },
      "mqttStatus": {
        "contentType": "text/plain",
        "description": "Retained. `online` while the bridge is connected, `offline` after a clean shutdown or, through the MQTT last will, when the connection drops.",
        "name": "mqttStatus",
        "payload": {
          "description": "Bridge availability: online or offline.",
          "enum": [
            "online",
            "offline"
          ],
          "type": "string"
        },
        "summary": "Bridge availability",
        "title": "Availability"
      },
      "state": {
        "contentType": "application/json",
        "description": "The first message after the handshake: the current bike status and the latest ride snapshot.",
        "name": "state",
        "payload": {
          "$ref": "#/components/schemas/WSState"
        },
        "summary": "Full state, sent once on connect",
        "title": "State"
      },
      "tick": {
        "contentType": "application/json",
        "description": "A ride snapshot, sent about once per second while a bike is connected.",
        "name": "tick",
        "payload": {
          "$ref": "#/components/schemas/WSTick"
        },
        "summary": "Ride snapshot",
        "title": "Tick"
      }
    },
    "schemas": {
      "ErrorBody": {
        "additionalProperties": false,
        "properties": {
          "code": {
            "description": "Machine-readable error code",
            "type": "string"
          },
          "details": {
            "$ref": "#/components/schemas/ErrorDetails",
            "description": "Machine-readable data for specific error codes; absent otherwise."
          },
          "message": {
            "description": "Human-readable explanation",
            "type": "string"
          }
        },
        "required": [
          "code",
          "message"
        ],
        "type": "object"
      },
      "ErrorDetails": {
        "additionalProperties": false,
        "properties": {
          "missing_tiles": {
            "description": "Map region tiles the request needs but that are not downloaded, such as E5_N45; set on 422 missing_tiles.",
            "items": {
              "type": "string"
            },
            "type": "array"
          }
        },
        "type": "object"
      },
      "HRInfo": {
        "additionalProperties": false,
        "properties": {
          "connected": {
            "description": "True while the source is delivering or able to deliver readings.",
            "type": "boolean"
          },
          "error": {
            "description": "Last error from the source; absent when it is healthy.",
            "type": "string"
          },
          "source": {
            "description": "Heart rate source: ble (Bluetooth monitor) or ha (Home Assistant entity).",
            "type": "string"
          },
          "target": {
            "description": "What the source reads: a Bluetooth address with optional monitor name, or a Home Assistant entity id.",
            "type": "string"
          }
        },
        "required": [
          "source",
          "target",
          "connected"
        ],
        "type": "object"
      },
      "MQTTState": {
        "additionalProperties": false,
        "properties": {
          "cadence_rpm": {
            "description": "Pedalling cadence in revolutions per minute, rounded to a whole rpm.",
            "format": "double",
            "type": "number"
          },
          "connected": {
            "description": "Whether the link to the bike is up right now.",
            "type": "boolean"
          },
          "distance_km": {
            "description": "Simulated distance covered in kilometres, to 0.001.",
            "format": "double",
            "type": "number"
          },
          "grade_pct": {
            "description": "Road grade in percent, to 0.1.",
            "format": "double",
            "type": "number"
          },
          "hr_bpm": {
            "description": "Heart rate in beats per minute; 0 when there is no heart rate source or no reading in the last 5 s.",
            "format": "int64",
            "type": "integer"
          },
          "level": {
            "description": "Resistance level (1 to 32) the engine last asked the bike for; 0 when no ride is active.",
            "format": "int64",
            "type": "integer"
          },
          "mode": {
            "description": "Ride mode name, for example free; empty when idle.",
            "type": "string"
          },
          "power_w": {
            "description": "Rider power in watts, rounded to a whole watt.",
            "format": "double",
            "type": "number"
          },
          "progress_pct": {
            "description": "Share of the route ridden in percent, to 0.1; 0 when not riding a route.",
            "format": "double",
            "type": "number"
          },
          "speed_kmh": {
            "description": "Simulated speed in kilometres per hour, to 0.1.",
            "format": "double",
            "type": "number"
          },
          "state": {
            "description": "Ride state: idle, connecting, ready, riding, paused or finished.",
            "type": "string"
          }
        },
        "required": [
          "state",
          "mode",
          "power_w",
          "cadence_rpm",
          "hr_bpm",
          "level",
          "speed_kmh",
          "grade_pct",
          "distance_km",
          "progress_pct",
          "connected"
        ],
        "type": "object"
      },
      "Status": {
        "additionalProperties": false,
        "properties": {
          "connected": {
            "description": "Whether a live link to the bike exists right now.",
            "type": "boolean"
          },
          "driver": {
            "description": "Driver from settings in use: auto, fitplus, ftms, ha or sim.",
            "type": "string"
          },
          "floor_unconfirmed": {
            "description": "True while the bike could not be confirmed back at its minimum level, so the rider should lower the resistance at the console; clears once a floor write is confirmed.",
            "type": "boolean"
          },
          "hint": {
            "description": "Advice for fixing LastError when it is a connection problem.",
            "type": "string"
          },
          "hr": {
            "$ref": "#/components/schemas/HRInfo",
            "description": "Heart rate source state; absent when heart_rate.source is off or its settings are unusable. The live reading is heart_rate_bpm in each tick."
          },
          "last_error": {
            "description": "Most recent problem: a failed connection, an idle release, or a bike that could not be confirmed back at its minimum level.",
            "type": "string"
          },
          "protocol": {
            "description": "Protocol of the live bike session: fitplus, ftms, ha or sim.",
            "type": "string"
          },
          "rider_id": {
            "description": "Rider bound to the bike; absent when idle.",
            "format": "int64",
            "type": "integer"
          },
          "since": {
            "description": "When State last changed (RFC 3339).",
            "format": "date-time",
            "type": "string"
          },
          "state": {
            "description": "idle when no bike is connected, otherwise the engine state: connecting, ready, riding, paused or finished.",
            "type": "string"
          }
        },
        "required": [
          "state",
          "connected",
          "floor_unconfirmed",
          "since"
        ],
        "type": "object"
      },
      "Tick": {
        "additionalProperties": false,
        "properties": {
          "alert": {
            "description": "Warning for the rider, for example a stale reading; absent when none.",
            "type": "string"
          },
          "at": {
            "description": "When this snapshot was taken (RFC 3339).",
            "format": "date-time",
            "type": "string"
          },
          "bias": {
            "description": "Live resistance bias in levels (-10 to 10) added to the route level; 0 outside route mode.",
            "format": "int64",
            "type": "integer"
          },
          "block_count": {
            "description": "Number of blocks in the workout being ridden; 0 outside a workout.",
            "format": "int64",
            "type": "integer"
          },
          "block_index": {
            "description": "Zero-based index of the current workout block; 0 outside a workout.",
            "format": "int64",
            "type": "integer"
          },
          "block_remaining_s": {
            "description": "Seconds left in the current workout block; 0 outside a workout.",
            "format": "double",
            "type": "number"
          },
          "cadence_rpm": {
            "description": "Pedalling cadence in revolutions per minute.",
            "format": "double",
            "type": "number"
          },
          "connected": {
            "description": "Whether the link to the bike is up right now.",
            "type": "boolean"
          },
          "distance_m": {
            "description": "Simulated distance covered, in metres.",
            "format": "double",
            "type": "number"
          },
          "elapsed_s": {
            "description": "Riding time in seconds.",
            "format": "double",
            "type": "number"
          },
          "grade_ahead_pct": {
            "description": "Road grade at the lookahead point of the route, in percent; 0 when not riding a route.",
            "format": "double",
            "type": "number"
          },
          "grade_pct": {
            "description": "Road grade of the current mode, in percent.",
            "format": "double",
            "type": "number"
          },
          "heart_rate_bpm": {
            "description": "Heart rate in beats per minute; 0 when there is no heart rate source or no reading in the last 5 s.",
            "format": "int64",
            "type": "integer"
          },
          "level": {
            "description": "Resistance level (1 to 32) the engine last asked the bike for.",
            "format": "int64",
            "type": "integer"
          },
          "mode": {
            "description": "Ride mode name, for example free.",
            "type": "string"
          },
          "power_w": {
            "description": "Rider power in watts.",
            "format": "double",
            "type": "number"
          },
          "reported_level": {
            "description": "Resistance level (1 to 32) the bike last reported; 0 when unknown.",
            "format": "int64",
            "type": "integer"
          },
          "route_id": {
            "description": "Identifier of the route being ridden; 0 when not riding a route.",
            "format": "int64",
            "type": "integer"
          },
          "route_length_m": {
            "description": "Length of the route being ridden, in metres; 0 when not riding a route.",
            "format": "double",
            "type": "number"
          },
          "speed_kmh": {
            "description": "Simulated speed in kilometres per hour.",
            "format": "double",
            "type": "number"
          },
          "state": {
            "description": "Ride state: idle, connecting, ready, riding, paused or finished.",
            "enum": [
              "idle",
              "connecting",
              "ready",
              "riding",
              "paused",
              "finished"
            ],
            "type": "string"
          },
          "target_power_w": {
            "description": "ERG target power in watts; 0 when the mode has no power target.",
            "format": "double",
            "type": "number"
          },
          "workout_id": {
            "description": "Identifier of the workout being ridden; 0 when not riding a workout.",
            "format": "int64",
            "type": "integer"
          }
        },
        "required": [
          "at",
          "state",
          "mode",
          "elapsed_s",
          "distance_m",
          "speed_kmh",
          "power_w",
          "cadence_rpm",
          "heart_rate_bpm",
          "grade_pct",
          "level",
          "reported_level",
          "connected",
          "route_id",
          "route_length_m",
          "grade_ahead_pct",
          "bias",
          "workout_id",
          "block_index",
          "block_count",
          "block_remaining_s",
          "target_power_w"
        ],
        "type": "object"
      },
      "WSAck": {
        "additionalProperties": false,
        "properties": {
          "id": {
            "description": "The id of the command being confirmed, as the client sent it.",
            "type": "string"
          },
          "type": {
            "description": "Message kind: always ack.",
            "enum": [
              "ack"
            ],
            "type": "string"
          }
        },
        "required": [
          "type",
          "id"
        ],
        "type": "object"
      },
      "WSBike": {
        "additionalProperties": false,
        "properties": {
          "bike": {
            "$ref": "#/components/schemas/Status",
            "description": "New bike connection status."
          },
          "type": {
            "description": "Message kind: always bike.",
            "enum": [
              "bike"
            ],
            "type": "string"
          }
        },
        "required": [
          "type",
          "bike"
        ],
        "type": "object"
      },
      "WSCommand": {
        "additionalProperties": false,
        "properties": {
          "command": {
            "description": "What to do: start, pause, resume or stop the ride, set_level (to value), level_delta (by value) or set_target_power (not supported yet).",
            "enum": [
              "start",
              "pause",
              "resume",
              "stop",
              "set_level",
              "level_delta",
              "set_target_power"
            ],
            "type": "string"
          },
          "id": {
            "description": "Client-chosen identifier, echoed in the ack or error that answers this command.",
            "type": "string"
          },
          "route_id": {
            "description": "Route to ride; only with start. The ride follows the route's grade using the rider bound to the bike.",
            "format": "int64",
            "type": "integer"
          },
          "type": {
            "description": "Message kind: always command.",
            "enum": [
              "command"
            ],
            "type": "string"
          },
          "value": {
            "description": "Resistance level for set_level, change in levels for level_delta; ignored by the other commands.",
            "format": "int64",
            "type": "integer"
          }
        },
        "required": [
          "type",
          "id",
          "command"
        ],
        "type": "object"
      },
      "WSError": {
        "additionalProperties": false,
        "properties": {
          "error": {
            "$ref": "#/components/schemas/ErrorBody",
            "description": "What went wrong. Codes: invalid_request, forbidden, unknown_command, unsupported_command, no_bike, bad_state, route_not_found, internal_error."
          },
          "id": {
            "description": "The id of the failed command; absent when the message could not be parsed.",
            "type": "string"
          },
          "type": {
            "description": "Message kind: always error.",
            "enum": [
              "error"
            ],
            "type": "string"
          }
        },
        "required": [
          "type",
          "error"
        ],
        "type": "object"
      },
      "WSState": {
        "additionalProperties": false,
        "properties": {
          "bike": {
            "$ref": "#/components/schemas/Status",
            "description": "Bike connection status right now."
          },
          "tick": {
            "$ref": "#/components/schemas/Tick",
            "description": "Latest ride snapshot right now."
          },
          "type": {
            "description": "Message kind: always state.",
            "enum": [
              "state"
            ],
            "type": "string"
          }
        },
        "required": [
          "type",
          "bike",
          "tick"
        ],
        "type": "object"
      },
      "WSTick": {
        "additionalProperties": false,
        "properties": {
          "tick": {
            "$ref": "#/components/schemas/Tick",
            "description": "Ride snapshot; sent about once per second while a bike is connected."
          },
          "type": {
            "description": "Message kind: always tick.",
            "enum": [
              "tick"
            ],
            "type": "string"
          }
        },
        "required": [
          "type",
          "tick"
        ],
        "type": "object"
      }
    },
    "securitySchemes": {
      "bearer": {
        "description": "An API token. A browser cannot set the Authorization header on a WebSocket, so offer it as a second subprotocol next to `wattson.v1`: `Sec-WebSocket-Protocol: wattson.v1, bearer.\u003ctoken\u003e`.",
        "scheme": "bearer",
        "type": "http"
      },
      "cookie": {
        "description": "The session cookie set by the login flow. The Origin header must name this server or the configured public URL.",
        "in": "cookie",
        "name": "wattson_session",
        "type": "httpApiKey"
      }
    }
  },
  "info": {
    "description": "Live ride feed and commands for the single bike a Wattson server controls. Open `/ws` offering the `wattson.v1` subprotocol. The server sends the full state first, then ride ticks and bike status changes. Commands need the `control` scope; the `read` scope only watches. The server pings every 30 seconds and re-checks the credential about once a minute, closing with status 4401 `unauthorized` when it is revoked or expired. Inbound messages are limited to 4096 bytes. The same ride is also published to an MQTT broker (see the `mqtt` server) for Home Assistant: availability and state topics, and one command topic per button.",
    "title": "Wattson ride feeds",
    "version": "1.0.0"
  },
  "operations": {
    "handleButton": {
      "action": "receive",
      "channel": {
        "$ref": "#/channels/wattson~1command~1%7Bcommand%7D"
      },
      "messages": [
        {
          "$ref": "#/channels/wattson~1command~1%7Bcommand%7D/messages/mqttPress"
        }
      ],
      "summary": "Home Assistant presses a button",
      "title": "Receive a button press"
    },
    "handleCommand": {
      "action": "receive",
      "channel": {
        "$ref": "#/channels/ride"
      },
      "messages": [
        {
          "$ref": "#/channels/ride/messages/command"
        }
      ],
      "summary": "The client sends commands",
      "title": "Send a ride command"
    },
    "publishAvailability": {
      "action": "send",
      "channel": {
        "$ref": "#/channels/wattson~1status"
      },
      "messages": [
        {
          "$ref": "#/channels/wattson~1status/messages/mqttStatus"
        }
      ],
      "summary": "Wattson publishes online and offline",
      "title": "Publish availability"
    },
    "publishRideEvents": {
      "action": "send",
      "channel": {
        "$ref": "#/channels/ride"
      },
      "messages": [
        {
          "$ref": "#/channels/ride/messages/state"
        },
        {
          "$ref": "#/channels/ride/messages/tick"
        },
        {
          "$ref": "#/channels/ride/messages/bike"
        },
        {
          "$ref": "#/channels/ride/messages/ack"
        },
        {
          "$ref": "#/channels/ride/messages/error"
        }
      ],
      "summary": "The server sends state, ticks, bike changes, acks and errors",
      "title": "Receive ride events"
    },
    "publishRideState": {
      "action": "send",
      "channel": {
        "$ref": "#/channels/wattson~1state"
      },
      "messages": [
        {
          "$ref": "#/channels/wattson~1state/messages/mqttState"
        }
      ],
      "summary": "Wattson publishes the ride state",
      "title": "Publish ride state"
    }
  },
  "servers": {
    "local": {
      "description": "A Wattson server; use wss when it is served over TLS.",
      "host": "localhost:8080",
      "pathname": "/ws",
      "protocol": "ws",
      "security": [
        {
          "$ref": "#/components/securitySchemes/bearer"
        },
        {
          "$ref": "#/components/securitySchemes/cookie"
        }
      ]
    },
    "mqtt": {
      "description": "The MQTT broker configured in the settings (mqtt:// or mqtts://). Wattson is a client; the base topic is fixed to `wattson` and Home Assistant discovery goes under the configurable prefix (default `homeassistant`).",
      "host": "broker:1883",
      "protocol": "mqtt",
      "protocolVersion": "5.0"
    }
  }
}
